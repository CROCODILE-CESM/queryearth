name: Publish to TestPyPI (every push to main) and PyPI (every release)

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm reads the version from git tags
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build a wheel and a source tarball
        run: |
          python -m pip install build
          python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # Each commit on main gets its own development version (for example
  # 0.1.1.dev3), so every push can be published to TestPyPI.
  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/queryearth
    permissions:
      id-token: write  # PyPI trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # A release tagged vX.Y.Z publishes version X.Y.Z.
  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/queryearth
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
